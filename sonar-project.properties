# SonarQube project configuration
sonar.projectKey=ecommerce-microservice-backend
sonar.projectName=Ecommerce Microservice Backend
sonar.projectVersion=1.0

# Source directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/test/**,**/tests/**,**/*.test.js,**/*.spec.js

# Language-specific settings
sonar.sourceEncoding=UTF-8

# Test coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Issue filters
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1186
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py
