name: Infrastructure CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'validate'
        type: choice
        options:
          - validate
          - deploy

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_IMAGE: ecommerce-backend

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 120}}}" \
            ansible/ kubernetes/ docker/ || true

      - name: Validate Ansible playbooks
        run: |
          cd ansible
          ansible-playbook playbooks/main.yml --syntax-check
          ansible-playbook playbooks/install-docker.yml --syntax-check
          ansible-playbook playbooks/setup-kubernetes.yml --syntax-check

      - name: Lint Ansible playbooks
        run: |
          ansible-lint ansible/playbooks/ || true

      - name: Validate Kubernetes manifests
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client
          
          for env in dev stage prod; do
            kubectl apply -f kubernetes/namespace-$env.yml --dry-run=client
            kubectl apply -f kubernetes/configmap-$env.yml --dry-run=client
            kubectl apply -f kubernetes/secrets-$env.yml --dry-run=client
            kubectl apply -f kubernetes/deployment-$env.yml --dry-run=client
          done

      - name: Validate Docker configuration
        run: |
          cd docker
          docker-compose config

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event.inputs.action == 'deploy'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Deploy to Kubernetes
        env:
          ENV: ${{ github.event.inputs.environment }}
        run: |
          export KUBECONFIG=./kubeconfig
          
          kubectl apply -f kubernetes/namespace-$ENV.yml
          kubectl apply -f kubernetes/configmap-$ENV.yml
          kubectl apply -f kubernetes/secrets-$ENV.yml
          kubectl apply -f kubernetes/deployment-$ENV.yml
          
          kubectl rollout status deployment/ecommerce-backend -n ecommerce-$ENV --timeout=5m

      - name: Verify deployment
        env:
          ENV: ${{ github.event.inputs.environment }}
        run: |
          export KUBECONFIG=./kubeconfig
          
          kubectl get pods -n ecommerce-$ENV
          kubectl get services -n ecommerce-$ENV
          kubectl get ingress -n ecommerce-$ENV

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan, docker-build, deploy-to-k8s]
    if: always()
    steps:
      - name: Send success notification
        if: success()
        run: echo "Pipeline completed successfully! 🎉"

      - name: Send failure notification
        if: failure()
        run: echo "Pipeline failed! ❌"
