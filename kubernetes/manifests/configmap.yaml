# ConfigMap para configuración de la aplicación E-commerce
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
  labels:
    app: ecommerce
data:
  # Spring Profiles
  SPRING_PROFILES_ACTIVE: "prod"
  
  # Eureka Configuration
  EUREKA_CLIENT_REGION: "default"
  EUREKA_CLIENT_AVAILABILITYZONES_DEFAULT: "myzone"
  EUREKA_CLIENT_SERVICEURL_MYZONE: "http://service-discovery:8761/eureka"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka/"
  
  # Zipkin Configuration
  SPRING_ZIPKIN_BASE_URL: "http://zipkin:9411"
  
  # Disable Cloud Config (using embedded configuration)
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  
  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ECOMMERCE: "DEBUG"
  
  # Database Configuration (H2 para desarrollo/testing)
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:ecommerce_dev_db;DB_CLOSE_ON_EXIT=FALSE"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_DATASOURCE_PASSWORD: ""
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.H2Dialect"
  SPRING_H2_CONSOLE_ENABLED: "true"
  SPRING_H2_CONSOLE_PATH: "/h2-console"
  
  # Application Configuration
  SERVER_COMPRESSION_ENABLED: "true"
  SPRING_MVC_THROW_EXCEPTION_IF_NO_HANDLER_FOUND: "true"
  SPRING_WEB_RESOURCES_ADD_MAPPINGS: "false"
