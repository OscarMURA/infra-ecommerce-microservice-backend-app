# Secret para credenciales sensibles
# IMPORTANTE: Este es un ejemplo. En producción, usar herramientas como:
# - Sealed Secrets
# - External Secrets Operator
# - HashiCorp Vault
# - Cloud Provider Secret Managers (AWS Secrets Manager, GCP Secret Manager, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
  labels:
    app: ecommerce
type: Opaque
stringData:
  # Database credentials (ejemplo - cambiar en producción)
  DB_USERNAME: "ecommerce_user"
  DB_PASSWORD: "change-this-password"
  
  # JWT Secret
  JWT_SECRET: "change-this-jwt-secret-key"
  
  # API Keys (ejemplo)
  # PAYMENT_API_KEY: "your-payment-api-key"
  # SHIPPING_API_KEY: "your-shipping-api-key"

---
# Secret para Docker Registry (si usas registry privado)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: ecommerce
type: kubernetes.io/dockerconfigjson
data:
  # Generar con: kubectl create secret docker-registry docker-registry-secret \
  #   --docker-server=<your-registry> \
  #   --docker-username=<username> \
  #   --docker-password=<password> \
  #   --docker-email=<email> \
  #   --dry-run=client -o yaml
  .dockerconfigjson: e30K  # placeholder - reemplazar con valor real
