#cloud-config
hostname: ecommerce-minikube-vm
manage_etc_hosts: true
ssh_pwauth: true

users:
  - name: jenkins
    gecos: Jenkins CI Runner
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

chpasswd:
  list: |
    jenkins:__VM_PASSWORD__
  expire: false

package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - jq
  - git
  - build-essential
  - python3
  - python3-pip
  - openjdk-17-jdk

write_files:
  - path: /etc/motd
    permissions: '0644'
    owner: root:root
    content: |
      Bienvenido a la VM de Minikube de ecommerce.
      Este host fue aprovisionado automáticamente por Jenkins para ejecutar pruebas con Minikube.

runcmd:
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - systemctl reload ssh || systemctl restart ssh

  - ufw allow 22/tcp
  - ufw allow 3000,8000,8080,8081,8082,8083,9411/tcp
  - ufw allow 8443/tcp  # Kubernetes API
  - ufw allow 30000:32767/tcp  # NodePort range
  - ufw --force enable

  - mkdir -p /opt/ecommerce-app
  - chown -R jenkins:jenkins /opt/ecommerce-app

  - bash -lc 'pip3 install --upgrade pip'

  # Instalar Trivy (escáner de vulnerabilidades)
  - wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | tee /usr/share/keyrings/trivy.gpg > /dev/null
  - echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | tee -a /etc/apt/sources.list.d/trivy.list
  - apt-get update
  - apt-get install -y trivy

final_message: "Cloud-init finished. Minikube VM is ready with Trivy. Docker, kubectl, and Minikube will be installed via SSH."