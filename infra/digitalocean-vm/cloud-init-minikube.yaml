#cloud-config
hostname: ecommerce-minikube-vm
manage_etc_hosts: true
ssh_pwauth: true

users:
  - name: jenkins
    gecos: Jenkins CI Runner
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

chpasswd:
  list: |
    jenkins:__VM_PASSWORD__
  expire: false

package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - jq
  - git
  - build-essential
  - python3
  - python3-pip
  - openjdk-17-jdk

write_files:
  - path: /etc/motd
    permissions: '0644'
    owner: root:root
    content: |
      Bienvenido a la VM de Minikube de ecommerce.
      Este host fue aprovisionado automáticamente por Jenkins para ejecutar pruebas con Minikube.

runcmd:
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - systemctl reload ssh || systemctl restart ssh

  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - bash -lc 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list'

  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker jenkins || true

  - ufw allow 22/tcp
  - ufw allow 3000,8000,8080,8081,8082,8083,9411/tcp
  - ufw allow 8443/tcp  # Kubernetes API
  - ufw allow 30000:32767/tcp  # NodePort range
  - ufw --force enable

  - mkdir -p /opt/ecommerce-app
  - chown -R jenkins:jenkins /opt/ecommerce-app

  - bash -lc 'pip3 install --upgrade pip'

  # Instalar Google Cloud SDK
  - echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
  - curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
  - apt-get update
  - apt-get install -y google-cloud-sdk google-cloud-sdk-gke-gcloud-auth-plugin
  - sudo -u jenkins gcloud config set core/disable_usage_reporting true
  - sudo -u jenkins gcloud config set component_manager/disable_update_check true

final_message: "Cloud-init finished. Host is ready for ecommerce integration jobs with Docker and gcloud. Minikube will be installed via SSH."